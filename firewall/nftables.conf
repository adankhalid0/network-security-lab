#!/usr/sbin/nft -f
# Segmentation ruleset for the network-security-lab
#
# Zones:
#   vlan10_corp  172.20.10.0/24  - corporate workstations/servers
#   vlan20_guest 172.20.20.0/24  - isolated guest network
#   vlan99_mgmt  172.20.99.0/24  - management / monitoring network
#
# Policy (east-west segmentation between the three zones):
#   - mgmt  -> corp, guest   : allowed (monitoring/administration)
#   - corp  -> mgmt          : allowed only on syslog (udp/514) for log shipping
#   - corp  -> guest         : denied  (segmentation between zones)
#   - guest -> corp          : denied
#   - guest -> mgmt          : denied  (guests must never reach management)
#   - everything else        : dropped and logged
#
# Internet/upstream access is intentionally out of scope for this lab,
# the goal here is to demonstrate east-west segmentation between zones,
# which is the same principle used to isolate VLANs on a real switch.

flush ruleset

table inet filter {

    chain forward {
        type filter hook forward priority 0; policy drop;

        # allow return traffic for already-established connections
        ct state established,related accept

        # management network can reach and administer both corp and guest
        ip saddr 172.20.99.0/24 ip daddr 172.20.10.0/24 accept
        ip saddr 172.20.99.0/24 ip daddr 172.20.20.0/24 accept

        # corp hosts may ship syslog to the monitoring host only
        ip saddr 172.20.10.0/24 ip daddr 172.20.99.0/24 udp dport 514 accept

        # explicit deny + log for cross-zone traffic that should never happen
        ip saddr 172.20.20.0/24 ip daddr 172.20.10.0/24 log prefix "DENY guest->corp: " drop
        ip saddr 172.20.20.0/24 ip daddr 172.20.99.0/24 log prefix "DENY guest->mgmt: " drop
        ip saddr 172.20.10.0/24 ip daddr 172.20.20.0/24 log prefix "DENY corp->guest: " drop
    }

    chain input {
        type filter hook input priority 0; policy accept;
    }

    chain output {
        type filter hook output priority 0; policy accept;
    }
}

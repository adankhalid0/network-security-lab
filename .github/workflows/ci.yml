name: Lab test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Validate compose file
        run: docker compose config -q

      - name: Start the lab
        run: docker compose up --build -d

      - name: Isolation tests
        run: bash scripts/test.sh

      - name: Show firewall rules and counters
        if: always()
        run: docker compose exec -T firewall nft list ruleset || true

      - name: Container state and logs
        if: always()
        run: |
          docker compose ps
          docker compose logs --no-color --tail 30 firewall || true

      - name: Tear down
        if: always()
        run: docker compose down -v
